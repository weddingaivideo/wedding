# Wrangler config for Cloudflare Pages — weddingai-video
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "weddingai-video"
compatibility_date = "2026-07-27"
pages_build_output_dir = "."

# Static site: all HTML / assets served from repo root.
# Functions live under /functions/ and are auto-deployed.

[env.production]
name = "weddingai-video"

# KV namespace for rate limiting + dead-letter queue for failed Resend sends.
# Reuses the same namespace for both bindings (separate key prefixes: `rl:` and `dl:`).
[[env.production.kv_namespaces]]
binding = "LEAD_STORAGE"
id = "681011664cfe4393aa485078662a1ed2"

# Backward-compat alias — the rate-limit code in functions/api/quote.js still
# reads env.RATE_LIMIT_KV, which now points at the same namespace.
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "681011664cfe4393aa485078662a1ed2"

# NOTE: Cron Triggers for Pages Functions are NOT configured here — wrangler.toml
# for Pages does not support `triggers`. The schedule is set in the Cloudflare
# dashboard:
#   Pages project → weddingai-video → Settings → Functions → Cron Triggers
#   → Add schedule: 0 9 * * *  (daily at 09:00 UTC)  → Path: /scheduled
# The handler itself is in functions/scheduled.js (exports `scheduled`).

# [[env.production.analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "weddingai_events"
