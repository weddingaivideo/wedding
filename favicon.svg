<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Film strip outer frame -->
  <rect x="4" y="4" width="56" height="56" rx="4" stroke="#D4AF37" stroke-width="2" fill="#FFFDF7"/>
  <!-- Sprocket holes - top -->
  <rect x="10" y="6" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="22" y="6" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="37" y="6" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="49" y="6" width="5" height="6" rx="1" fill="#D4AF37"/>
  <!-- Sprocket holes - bottom -->
  <rect x="10" y="52" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="22" y="52" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="37" y="52" width="5" height="6" rx="1" fill="#D4AF37"/>
  <rect x="49" y="52" width="5" height="6" rx="1" fill="#D4AF37"/>
  <!-- Sprocket holes - left -->
  <rect x="6" y="17" width="6" height="5" rx="1" fill="#D4AF37"/>
  <rect x="6" y="28" width="6" height="5" rx="1" fill="#D4AF37"/>
  <rect x="6" y="39" width="6" height="5" rx="1" fill="#D4AF37"/>
  <!-- Sprocket holes - right -->
  <rect x="52" y="17" width="6" height="5" rx="1" fill="#D4AF37"/>
  <rect x="52" y="28" width="6" height="5" rx="1" fill="#D4AF37"/>
  <rect x="52" y="39" width="6" height="5" rx="1" fill="#D4AF37"/>
  <!-- Engagement ring outer -->
  <circle cx="32" cy="32" r="14" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
  <!-- Diamond on top -->
  <polygon points="32,15 27,23 37,23" fill="#D4AF37"/>
  <polygon points="27,23 37,23 32,19" fill="#E8C97A"/>
  <line x1="27" y1="23" x2="37" y2="23" stroke="#D4AF37" stroke-width="1"/>
  <line x1="32" y1="15" x2="27" y2="23" stroke="#D4AF37" stroke-width="1"/>
  <line x1="32" y1="15" x2="37" y2="23" stroke="#D4AF37" stroke-width="1"/>
  <line x1="32" y1="15" x2="32" y2="19" stroke="#D4AF37" stroke-width="0.75"/>
  <!-- Ring inner fill suggestion -->
  <circle cx="32" cy="32" r="10" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Star sparkle -->
  <circle cx="44" cy="18" r="1.5" fill="#D4AF37"/>
  <circle cx="20" cy="48" r="1" fill="#D4AF37"/>
</svg>